 name: CI and DockerHub publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*" # теги вида v1.0.0, v0.1.0 и т.п.
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # Здесь можно добавить дополнительные проверки (go vet, golangci-lint и т.п.)
      - name: Run tests
        run: go test ./...

  publish:
    name: Build and push to DockerHub
    needs: test
    runs-on: ubuntu-latest
    # Запускается только при пуше тега
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/parcel-tracker:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/parcel-tracker:latest

